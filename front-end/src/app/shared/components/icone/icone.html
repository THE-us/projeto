<svg [attr.width]="tamanho" [attr.height]="tamanho" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" [ngSwitch]="nome">
  <g *ngSwitchCase="'menu'">
    <line x1="4" y1="6" x2="20" y2="6"></line>
    <line x1="4" y1="12" x2="20" y2="12"></line>
    <line x1="4" y1="18" x2="20" y2="18"></line>
  </g>
  <g *ngSwitchCase="'fechar'">
    <line x1="6" y1="6" x2="18" y2="18"></line>
    <line x1="18" y1="6" x2="6" y2="18"></line>
  </g>
  <g *ngSwitchCase="'usuario'">
    <circle cx="12" cy="8" r="4"></circle>
    <path d="M4 20c0-3.5 3.6-6 8-6s8 2.5 8 6"></path>
  </g>
  <g *ngSwitchCase="'cadeado'">
    <rect x="5" y="11" width="14" height="10" rx="2"></rect>
    <path d="M8 11V7a4 4 0 0 1 8 0v4"></path>
  </g>
  <g *ngSwitchCase="'sair'">
    <path d="M10 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4"></path>
    <polyline points="15 8 19 12 15 16"></polyline>
    <line x1="19" y1="12" x2="9" y2="12"></line>
  </g>
  <g *ngSwitchCase="'grafico'">
    <line x1="4" y1="20" x2="20" y2="20"></line>
    <rect x="6" y="11" width="3" height="6"></rect>
    <rect x="11" y="7" width="3" height="10"></rect>
    <rect x="16" y="13" width="3" height="4"></rect>
  </g>
  <g *ngSwitchCase="'radar'">
    <circle cx="12" cy="12" r="8"></circle>
    <circle cx="12" cy="12" r="4"></circle>
    <line x1="12" y1="12" x2="17.5" y2="6.5"></line>
  </g>
  <g *ngSwitchCase="'calendario'">
    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
    <line x1="4" y1="10" x2="20" y2="10"></line>
    <line x1="9" y1="3" x2="9" y2="7"></line>
    <line x1="15" y1="3" x2="15" y2="7"></line>
  </g>
  <g *ngSwitchCase="'carro'">
    <path d="M5 16V12l2-5h10l2 5v4"></path>
    <line x1="4" y1="16" x2="20" y2="16"></line>
    <circle cx="8" cy="18" r="1.5"></circle>
    <circle cx="16" cy="18" r="1.5"></circle>
  </g>
  <g *ngSwitchCase="'busca'">
    <circle cx="11" cy="11" r="6"></circle>
    <line x1="20" y1="20" x2="15.5" y2="15.5"></line>
  </g>
</svg>
