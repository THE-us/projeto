<div class="container" style="padding: 20px; background-color: #e5e7e9; min-height: 100vh;">
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
    <h2 style="color: #2c3e50; font-weight: 400; margin: 0;">Pesquisar Equipamento</h2>
    <!-- Este botão redireciona para a rota /equipamento/novo -->
    <button class="btn-azul" routerLink="/equipamento/novo">+ Novo Equipamento</button>
  </div>

<!-- Painel de Filtros -->
  <div class="filtros-card">
    <!-- O ngSubmit assume o controlo: captura o clique no botão e o Enter no teclado! -->
    <form (ngSubmit)="pesquisar()">
      <div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end;">

        <div class="form-group">
          <label>Código</label>
          <!-- Removidos os (keyup.enter) e (change) -->
          <input type="text" name="codigo" [(ngModel)]="filtros.codigo" placeholder="Ex: 0000000">
        </div>

        <div class="form-group">
          <label>Faixa</label>
          <input type="number" name="faixa" [(ngModel)]="filtros.faixa" placeholder="Ex: 1">
        </div>

        <div class="form-group">
          <label>Status</label>
          <select name="ativo" [(ngModel)]="filtros.ativo">
            <option value="">Todos</option>
            <option value="1">Ativo</option>
            <option value="0">Inativo</option>
          </select>
        </div>

        <div class="form-group">
          <label>Nome do Integrador</label>
          <input type="text" name="integradorNome" [(ngModel)]="filtros.integradorNome" placeholder="Ex: Nome do integrador">
        </div>

        <div class="acoes-filtro">
          <!-- O botão de pesquisar agora é type="submit" e não tem (click) -->
          <button type="submit" class="btn-azul">Pesquisar</button>

          <!-- O botão de limpar continua como type="button" para não submeter o form -->
          <button type="button" class="btn-cinza" (click)="limparFiltros()">Limpar</button>
        </div>

      </div>
    </form>
  </div>

  <!-- Tabela de Resultados -->
  <table border="1" cellpadding="12" cellspacing="0" class="tabela-dados">
    <thead>
      <tr>
        <th>Código</th>
        <th>Marca / Modelo</th>
        <th>Tipo</th>
        <th>Faixa</th>
        <th>Local</th>
        <th>Status</th>
        <th style="text-align: center;">Ações</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let eq of equipamentos">
        <td>{{ eq.codigo }}</td>
        <td>{{ eq.marca }} / {{ eq.modelo }}</td>
        <td>{{ eq.tipo }}</td>
        <td>{{ eq.faixa }}</td>
        <td>{{ eq.local }}</td>
        <td [style.color]="eq.ativo ? '#27ae60' : '#e74c3c'">
          <b>{{ eq.ativo ? 'Ativo' : 'Inativo' }}</b>
        </td>
        <td style="text-align: center;">
          <button type="button" class="btn-editar" [routerLink]="['/equipamento/editar', eq.id]">Editar</button>
          <button type="button" class="btn-excluir" (click)="excluir(eq.id)">Excluir</button>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="equipamentos.length === 0" style="margin-top: 20px; color: #7f8c8d;">
    Nenhum equipamento encontrado com os filtros informados.
  </div>
</div>
