<div class="container-usuario">
  <h2>Novo Usuário</h2>

  <div class="filtros-card card-formulario">
    <form (ngSubmit)="salvar()" #formUsuario="ngForm">

      <div class="form-group">
        <label>Nome Completo *</label>
        <input type="text" name="nome" [(ngModel)]="usuario.nome" placeholder="Digite o nome" required maxlength="100">
      </div>

      <div class="form-group">
        <label>Login de Acesso *</label>
        <input type="text" name="login" [(ngModel)]="usuario.login" placeholder="Ex: admin" required minlength="3" maxlength="30">
      </div>

      <div class="form-group">
        <label>Senha *</label>
        <input type="password" name="senha" [(ngModel)]="usuario.senha" placeholder="Mínimo 6 caracteres" required minlength="6" maxlength="15">
      </div>

      <div class="form-group">
        <label>Status</label>
        <select name="ativo" [(ngModel)]="usuario.ativo">
          <option [ngValue]="1">Ativo</option>
          <option [ngValue]="0">Inativo</option>
        </select>
      </div>

      <div class="acoes-form">
        <button type="button" class="btn-cinza" (click)="cancelar()" [disabled]="carregando">Cancelar</button>
        <button type="submit" class="btn-azul" [disabled]="carregando || formUsuario.invalid">
          {{ carregando ? 'Salvando...' : 'Salvar Usuário' }}
        </button>
      </div>

    </form>
  </div>
</div>
